<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video Splitter Pro</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, sans-serif;
    background:#111827;
    color:#fff;
    padding:20px;
}

.container{
    max-width:900px;
    margin:auto;
}

h1{
    text-align:center;
    margin-bottom:20px;
}

.card{
    background:#1f2937;
    border-radius:12px;
    padding:20px;
    margin-bottom:20px;
}

#dropZone{
    border:3px dashed #4b5563;
    border-radius:12px;
    padding:50px;
    text-align:center;
    cursor:pointer;
    transition:.3s;
}

#dropZone.dragover{
    border-color:#3b82f6;
    background:#1e3a8a;
}

video{
    width:100%;
    margin-top:15px;
    border-radius:10px;
    display:none;
}

.stats{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
    gap:10px;
    margin-top:15px;
}

.stat{
    background:#111827;
    padding:15px;
    border-radius:10px;
    text-align:center;
}

select,
input,
button{
    width:100%;
    padding:12px;
    margin-top:10px;
    border:none;
    border-radius:8px;
}

button{
    background:#2563eb;
    color:white;
    cursor:pointer;
}

button:hover{
    background:#1d4ed8;
}

.dark-toggle{
    float:right;
    width:auto;
    padding:10px;
}

.progress{
    margin-top:20px;
    background:#374151;
    height:22px;
    border-radius:20px;
    overflow:hidden;
}

.bar{
    width:0%;
    height:100%;
    background:#22c55e;
    transition:.3s;
}
</style>
</head>
<body>

<div class="container">

<button class="dark-toggle" onclick="toggleTheme()">
Toggle Theme
</button>

<h1>Video Splitter Pro</h1>

<div class="card">

<div id="dropZone">
<h2>Drag & Drop Video</h2>
<p>or click to upload</p>
<input type="file" id="videoInput" accept="video/*" hidden>
</div>

<video id="videoPreview" controls></video>

<div class="stats">

<div class="stat">
<h3>Duration</h3>
<p id="duration">-</p>
</div>

<div class="stat">
<h3>Size</h3>
<p id="size">-</p>
</div>

<div class="stat">
<h3>Segments</h3>
<p id="segments">-</p>
</div>

</div>

</div>

<div class="card">

<h2>Split Settings</h2>

<select id="segmentLength">
<option value="60">YouTube Shorts (60 sec)</option>
<option value="90">Instagram Reels (90 sec)</option>
<option value="180">TikTok (3 mins)</option>
<option value="300">5 Minutes</option>
<option value="600" selected>10 Minutes</option>
<option value="900">15 Minutes</option>
<option value="1800">30 Minutes</option>
</select>

<button onclick="calculateSegments()">
Calculate Segments
</button>

<button onclick="fakeProcess()">
Split Video
</button>

<div class="progress">
<div class="bar" id="progressBar"></div>
</div>

</div>

</div>

<script>

let uploadedFile = null;
let durationSeconds = 0;

const dropZone = document.getElementById("dropZone");
const fileInput = document.getElementById("videoInput");
const preview = document.getElementById("videoPreview");

dropZone.addEventListener("click",()=>{
    fileInput.click();
});

dropZone.addEventListener("dragover",(e)=>{
    e.preventDefault();
    dropZone.classList.add("dragover");
});

dropZone.addEventListener("dragleave",()=>{
    dropZone.classList.remove("dragover");
});

dropZone.addEventListener("drop",(e)=>{
    e.preventDefault();
    dropZone.classList.remove("dragover");

    const file=e.dataTransfer.files[0];

    if(file){
        loadVideo(file);
    }
});

fileInput.addEventListener("change",(e)=>{
    const file=e.target.files[0];

    if(file){
        loadVideo(file);
    }
});

function loadVideo(file){

    uploadedFile=file;

    document.getElementById("size").innerText=
        (file.size/1024/1024).toFixed(2)+" MB";

    const url=URL.createObjectURL(file);

    preview.src=url;
    preview.style.display="block";

    preview.onloadedmetadata=()=>{

        durationSeconds=Math.floor(preview.duration);

        const mins=Math.floor(durationSeconds/60);
        const secs=durationSeconds%60;

        document.getElementById("duration").innerText=
            mins+"m "+secs+"s";

        calculateSegments();
    };
}

function calculateSegments(){

    if(!durationSeconds) return;

    const segLength=
        parseInt(
            document.getElementById("segmentLength").value
        );

    const clips=
        Math.ceil(durationSeconds/segLength);

    document.getElementById("segments").innerText=
        clips;
}

function fakeProcess(){

    if(!uploadedFile){
        alert("Please upload a video.");
        return;
    }

    let progress=0;

    const interval=setInterval(()=>{

        progress+=5;

        document.getElementById("progressBar").style.width=
            progress+"%";

        if(progress>=100){

            clearInterval(interval);

            alert(
                "Ready for FFmpeg integration. This starter UI is working correctly."
            );
        }

    },100);

}

function toggleTheme(){

    const body=document.body;

    if(body.style.background==="white"){

        body.style.background="#111827";
        body.style.color="white";

    }else{

        body.style.background="white";
        body.style.color="#111827";

    }

}

</script>

</body>
</html>
