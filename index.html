<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video Splitter Pro</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    background:#111827;
    color:#fff;
    padding:20px;
}

.container{
    max-width:1000px;
    margin:auto;
}

h1{
    text-align:center;
    margin-bottom:20px;
}

.card{
    background:#1f2937;
    border-radius:12px;
    padding:20px;
    margin-bottom:20px;
}

#dropZone{
    border:3px dashed #555;
    border-radius:12px;
    padding:40px;
    text-align:center;
    cursor:pointer;
    transition:0.3s;
}

#dropZone.drag{
    border-color:#3b82f6;
    background:#172554;
}

video{
    width:100%;
    margin-top:20px;
    display:none;
    border-radius:12px;
}

.stats{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
    gap:10px;
    margin-top:20px;
}

.stat{
    background:#111827;
    padding:15px;
    border-radius:10px;
    text-align:center;
}

select,
button{
    width:100%;
    padding:12px;
    margin-top:10px;
    border:none;
    border-radius:8px;
}

button{
    background:#2563eb;
    color:white;
    cursor:pointer;
}

button:hover{
    background:#1d4ed8;
}

.progress{
    margin-top:20px;
    background:#374151;
    height:25px;
    border-radius:30px;
    overflow:hidden;
}

.bar{
    width:0%;
    height:100%;
    background:#22c55e;
}

#downloads{
    margin-top:20px;
}

#downloads a{
    display:block;
    color:#60a5fa;
    margin:10px 0;
}
</style>
</head>
<body>

<div class="container">

<h1>Video Splitter Pro</h1>

<div class="card">

<div id="dropZone">
<h2>Drag & Drop Video Here</h2>
<p>or click to upload</p>
<input type="file" id="videoInput" accept="video/*" hidden>
</div>

<video id="videoPreview" controls></video>

<div class="stats">
<div class="stat">
<h3>Duration</h3>
<p id="duration">-</p>
</div>

<div class="stat">
<h3>Size</h3>
<p id="size">-</p>
</div>

<div class="stat">
<h3>Segments</h3>
<p id="segments">-</p>
</div>
</div>

</div>

<div class="card">

<h2>Split Settings</h2>

<select id="segmentLength">
<option value="60">YouTube Shorts (60s)</option>
<option value="90">Instagram Reels (90s)</option>
<option value="180">TikTok (3 mins)</option>
<option value="300">5 Minutes</option>
<option value="600" selected>10 Minutes</option>
<option value="900">15 Minutes</option>
<option value="1800">30 Minutes</option>
</select>

<button id="splitBtn">
Split Video
</button>

<div class="progress">
<div class="bar" id="progressBar"></div>
</div>

<div id="downloads"></div>

</div>

</div>

<script type="module">

import { FFmpeg } from 'https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.10/dist/esm/index.js';
import { fetchFile, toBlobURL } from 'https://cdn.jsdelivr.net/npm/@ffmpeg/util@0.12.1/dist/esm/index.js';

const ffmpeg = new FFmpeg();

let uploadedFile = null;
let durationSeconds = 0;

const dropZone = document.getElementById("dropZone");
const fileInput = document.getElementById("videoInput");
const preview = document.getElementById("videoPreview");

dropZone.addEventListener("click",()=>fileInput.click());

dropZone.addEventListener("dragover",(e)=>{
    e.preventDefault();
    dropZone.classList.add("drag");
});

dropZone.addEventListener("dragleave",()=>{
    dropZone.classList.remove("drag");
});

dropZone.addEventListener("drop",(e)=>{
    e.preventDefault();
    dropZone.classList.remove("drag");

    const file = e.dataTransfer.files[0];

    if(file){
        loadVideo(file);
    }
});

fileInput.addEventListener("change",(e)=>{
    const file = e.target.files[0];

    if(file){
        loadVideo(file);
    }
});

function loadVideo(file){

    uploadedFile = file;

    document.getElementById("size").innerText =
        (file.size / 1024 / 1024).toFixed(2) + " MB";

    const url = URL.createObjectURL(file);

    preview.src = url;
    preview.style.display = "block";

    preview.onloadedmetadata = ()=>{

        durationSeconds =
            Math.floor(preview.duration);

        const mins =
            Math.floor(durationSeconds/60);

        const secs =
            durationSeconds % 60;

        document.getElementById("duration")
            .innerText =
            mins + "m " + secs + "s";

        updateEstimate();
    };
}

function updateEstimate(){

    if(!durationSeconds) return;

    const segmentLength =
        parseInt(
            document.getElementById("segmentLength").value
        );

    const clips =
        Math.ceil(
            durationSeconds / segmentLength
        );

    document.getElementById("segments")
        .innerText = clips;
}

document
.getElementById("segmentLength")
.addEventListener("change",updateEstimate);

document
.getElementById("splitBtn")
.addEventListener("click",splitVideo);

async function splitVideo(){

    if(!uploadedFile){
        alert("Upload a video first.");
        return;
    }

    document.getElementById("downloads")
        .innerHTML = "";

    try{

        if(!ffmpeg.loaded){

            alert(
                "Loading FFmpeg (first time can take 10-20 seconds)..."
            );

         await ffmpeg.load({
    coreURL: "./ffmpeg/ffmpeg-core.js",
    wasmURL: "./ffmpeg/ffmpeg-core.wasm"
});
        }

        ffmpeg.on("progress",({progress})=>{

            document.getElementById("progressBar")
                .style.width =
                Math.round(progress * 100) + "%";
        });

        await ffmpeg.writeFile(
            "input.mp4",
            await fetchFile(uploadedFile)
        );

        const segmentLength =
            document.getElementById("segmentLength")
            .value;

        await ffmpeg.exec([
            "-i",
            "input.mp4",
            "-c",
            "copy",
            "-map",
            "0",
            "-f",
            "segment",
            "-segment_time",
            segmentLength,
            "clip_%03d.mp4"
        ]);

        await createDownloadLinks();

    }
    catch(error){

        console.error(error);

        alert(
            "Processing failed. Open browser console (F12) for details."
        );
    }
}

async function createDownloadLinks(){

    const downloads =
        document.getElementById("downloads");

    downloads.innerHTML =
        "<h2>Download Clips</h2>";

    let count = 0;

    while(true){

        const fileName =
            `clip_${String(count).padStart(3,"0")}.mp4`;

        try{

            const data =
                await ffmpeg.readFile(fileName);

            const blob =
                new Blob(
                    [data.buffer],
                    {type:"video/mp4"}
                );

            const url =
                URL.createObjectURL(blob);

            const link =
                document.createElement("a");

            link.href = url;
            link.download = fileName;
            link.innerText =
                "Download " + fileName;

            downloads.appendChild(link);

            count++;

        }
        catch{

            break;
        }
    }

    if(count===0){

        downloads.innerHTML +=
            "<p>No clips generated.</p>";
    }
}

</script>

</body>
</html>
